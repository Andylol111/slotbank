# 30+ tok/s path (Qwen3.5-4B). Different model, not a 27B drafter.
# Picker: llama.cpp/Qwen3.5-4B-4bit
# Then: omp models refresh  (F5 keeps a cached empty list)
providers:
  llama.cpp:
    baseUrl: http://127.0.0.1:8080/v1
    api: openai-completions
    auth: none
    disableStrictTools: true
    models:
      - id: Qwen3.5-4B-4bit
        name: Qwen3.5-4B-4bit (slotbank)
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh]
          defaultLevel: high
        input: [text]
        tokenizer: qwen3
        contextWindow: 32768
        maxTokens: 8192
        supportsTools: true
        compat:
          thinkingFormat: qwen-chat-template
          supportsReasoningParams: true
