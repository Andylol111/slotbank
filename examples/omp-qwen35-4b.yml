# 30+ tok/s path (Qwen3.5-4B). Different model, not a 27B drafter.
# Picker: llama.cpp/Qwen3.5-4B-4bit
# Then: omp models refresh
providers:
  llama.cpp:
    baseUrl: http://127.0.0.1:8080/v1
    api: openai-completions
    auth: none
    disableStrictTools: true
    models:
      - id: Qwen3.5-4B-4bit
        name: Qwen3.5-4B
        reasoning: false
        input: [text]
        tokenizer: qwen3
        contextWindow: 65536
        maxTokens: 2048
        supportsTools: true
        compat:
          streamIdleTimeoutMs: 600000
