# Oh My Pi 18 /model local pane is llama.cpp + lm-studio.
# Do NOT put `discovery:` on llama.cpp / lm-studio (F5 caches an empty list).
# After writing: omp models refresh
# Serve envelopes OMP dumps (condense + slim tools + pack). Empty dir is
# still the cheapest hi. cwd /tmp with a child git repo dumps that tree
# (~39k); contextWindow 65536 is the OMP *session* so that dump does not
# trip compaction. Metal still prefills the 8k envelope, not 64k.
#
# Picker (fast hi, no tools):  llama.cpp/Qwen3.8-27B-4bit
# Agent (tools + thinking):    llama.cpp/Qwen3.8-27B-4bit-agent
# Anthropic alias:             slotbank/Qwen3.8-27B-4bit
#
# maxTokens 2048 + thinking defaultLevel low: 8192/high cooked RAM on "hi".
# 27B 4-bit load is ~30s; wait for serve "ready".
#
#   PYTHONPATH=src .venv/bin/python -m slotbank.cli serve \
#     --model ~/Models/Qwen3.8-27B-4bit \
#     --leave-free 6g --thinking --vision --direct
providers:
  llama.cpp:
    baseUrl: http://127.0.0.1:8080/v1
    api: openai-completions
    auth: none
    disableStrictTools: true
    models:
      - id: Qwen3.8-27B-4bit
        name: Qwen3.8-27B-4bit (slotbank)
        reasoning: false
        input: [text, image]
        tokenizer: qwen3
        contextWindow: 65536
        maxTokens: 2048
        supportsTools: false
        compat:
          thinkingFormat: qwen-chat-template
          supportsReasoningParams: true
          streamIdleTimeoutMs: 600000
      - id: Qwen3.8-27B-4bit-agent
        name: Qwen3.8-27B-4bit-agent (slotbank)
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh]
          defaultLevel: low
        input: [text, image]
        tokenizer: qwen3
        contextWindow: 65536
        maxTokens: 2048
        supportsTools: true
        compat:
          thinkingFormat: qwen-chat-template
          supportsReasoningParams: true
          streamIdleTimeoutMs: 600000
  lm-studio:
    baseUrl: http://127.0.0.1:8080/v1
    api: openai-completions
    auth: none
    disableStrictTools: true
    models:
      - id: Qwen3.8-27B-4bit
        name: Qwen3.8-27B-4bit (slotbank)
        reasoning: false
        input: [text, image]
        tokenizer: qwen3
        contextWindow: 65536
        maxTokens: 2048
        supportsTools: false
        compat:
          thinkingFormat: qwen-chat-template
          supportsReasoningParams: true
          streamIdleTimeoutMs: 600000
      - id: Qwen3.8-27B-4bit-agent
        name: Qwen3.8-27B-4bit-agent (slotbank)
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh]
          defaultLevel: low
        input: [text, image]
        tokenizer: qwen3
        contextWindow: 65536
        maxTokens: 2048
        supportsTools: true
        compat:
          thinkingFormat: qwen-chat-template
          supportsReasoningParams: true
          streamIdleTimeoutMs: 600000
  slotbank:
    baseUrl: http://127.0.0.1:8080/v1
    api: anthropic-messages
    auth: none
    disableStrictTools: true
    discovery:
      type: openai-models-list
      timeoutMs: 30000
    models:
      - id: Qwen3.8-27B-4bit
        name: Qwen3.8-27B-4bit (slotbank)
        reasoning: false
        input: [text, image]
        tokenizer: qwen3
        contextWindow: 65536
        maxTokens: 2048
        supportsTools: false
        compat:
          streamIdleTimeoutMs: 600000
      - id: Qwen3.8-27B-4bit-agent
        name: Qwen3.8-27B-4bit-agent (slotbank)
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh]
          defaultLevel: low
        input: [text, image]
        tokenizer: qwen3
        contextWindow: 65536
        maxTokens: 2048
        supportsTools: true
        compat:
          streamIdleTimeoutMs: 600000
