# Oh My Pi (OMP) → slotbank Anthropic Messages door.
# Current OMP schema (baseUrl / api / auth). The old type/base_url shape
# fails validation and OMP then ignores every custom provider for that run.
#
# `slotbank serve` writes this to ~/.omp/agent/models.yml itself.
# Refresh the picker with: omp models slotbank
# Selector: slotbank/Qwen3.8-27B-4bit
#
# 4-bit + native MTP (trained K=3). OMP/Anthropic default temperature is 1.0
# (thinking samples). Greedy 13.47/9.95 was a temp-0 bench, not this door.
# Qwen3.5-4B+DFlash is a separate ~46–54 tok/s model, not a 27B drafter.
#   PYTHONPATH=src .venv/bin/python -m slotbank.cli serve \
#     --model ~/Models/Qwen3.8-27B-4bit \
#     --draft ~/Models/Qwen3.8-27B-MTP-4bit \
#     --leave-free 6g --thinking --vision --direct
providers:
  slotbank:
    baseUrl: http://127.0.0.1:8080/v1
    api: anthropic-messages
    auth: none
    disableStrictTools: true
    discovery:
      type: openai-models-list
      timeoutMs: 2000
    models:
      - id: Qwen3.8-27B-4bit
        name: Qwen3.8-27B-4bit (slotbank)
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh]
          defaultLevel: high
        input: [text, image]
        tokenizer: qwen3
        contextWindow: 16384
        maxTokens: 8192
        supportsTools: true
