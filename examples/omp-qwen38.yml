# Oh My Pi 18 /model local pane is llama.cpp (probes :8080/models), not a
# custom provider id. `slotbank serve` writes both blocks into
# ~/.omp/agent/models.yml. F5 in /model, or: omp models llama.cpp
# Picker: llama.cpp/Qwen3.8-27B-4bit
#
# 4-bit + native MTP (trained K=3). OMP default temperature is 1.0.
#   PYTHONPATH=src .venv/bin/python -m slotbank.cli serve \
#     --model ~/Models/Qwen3.8-27B-4bit \
#     --leave-free 6g --thinking --vision --direct
providers:
  llama.cpp:
    baseUrl: http://127.0.0.1:8080/v1
    api: openai-completions
    auth: none
    disableStrictTools: true
    discovery:
      type: openai-models-list
      timeoutMs: 30000
    models:
      - id: Qwen3.8-27B-4bit
        name: Qwen3.8-27B-4bit (slotbank)
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh]
          defaultLevel: high
        input: [text, image]
        tokenizer: qwen3
        contextWindow: 16384
        maxTokens: 8192
        supportsTools: true
        compat:
          thinkingFormat: qwen-chat-template
          supportsReasoningParams: true
  slotbank:
    baseUrl: http://127.0.0.1:8080/v1
    api: anthropic-messages
    auth: none
    disableStrictTools: true
    discovery:
      type: openai-models-list
      timeoutMs: 30000
    models:
      - id: Qwen3.8-27B-4bit
        name: Qwen3.8-27B-4bit (slotbank)
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh]
          defaultLevel: high
        input: [text, image]
        tokenizer: qwen3
        contextWindow: 16384
        maxTokens: 8192
        supportsTools: true
