# Oh My Pi 18 /model local pane is llama.cpp + lm-studio.
# Do NOT put `discovery:` on llama.cpp / lm-studio (F5 caches an empty list).
# After writing: omp models refresh
#
# Names are short so the welcome pane fits (not "…-agent (slotbank)").
# reasoning is off: Qwen opens <think> in the prompt, so a think dump was the
# visible reply. Default is this model's /no_think + instruct sampling
# (temp 0.7, top_p 0.8, top_k 20) when OMP sends 1.0. Put /think on the last
# ask to reason (0.6 / 0.95 / 20). Not an OMP harness temperature field.
#
# Picker (fast hi, no tools):  llama.cpp/Qwen3.8-27B-4bit
# Agent (tools, no think UI):  llama.cpp/Qwen3.8-27B-4bit-agent
# Anthropic alias:             slotbank/Qwen3.8-27B-4bit
#
#   PYTHONPATH=src .venv/bin/python -m slotbank.cli serve \
#     --model ~/Models/Qwen3.8-27B-4bit \
#     --leave-free 6g --thinking --vision --direct
providers:
  llama.cpp:
    baseUrl: http://127.0.0.1:8080/v1
    api: openai-completions
    auth: none
    disableStrictTools: true
    models:
      - id: Qwen3.8-27B-4bit
        name: Qwen3.8-27B
        reasoning: false
        input: [text, image]
        tokenizer: qwen3
        contextWindow: 65536
        maxTokens: 2048
        supportsTools: false
        compat:
          streamIdleTimeoutMs: 600000
      - id: Qwen3.8-27B-4bit-agent
        name: "Qwen3.8-27B tools"
        reasoning: false
        input: [text, image]
        tokenizer: qwen3
        contextWindow: 65536
        maxTokens: 2048
        supportsTools: true
        compat:
          streamIdleTimeoutMs: 600000
  lm-studio:
    baseUrl: http://127.0.0.1:8080/v1
    api: openai-completions
    auth: none
    disableStrictTools: true
    models:
      - id: Qwen3.8-27B-4bit
        name: Qwen3.8-27B
        reasoning: false
        input: [text, image]
        tokenizer: qwen3
        contextWindow: 65536
        maxTokens: 2048
        supportsTools: false
        compat:
          streamIdleTimeoutMs: 600000
      - id: Qwen3.8-27B-4bit-agent
        name: "Qwen3.8-27B tools"
        reasoning: false
        input: [text, image]
        tokenizer: qwen3
        contextWindow: 65536
        maxTokens: 2048
        supportsTools: true
        compat:
          streamIdleTimeoutMs: 600000
  slotbank:
    baseUrl: http://127.0.0.1:8080/v1
    api: anthropic-messages
    auth: none
    disableStrictTools: true
    discovery:
      type: openai-models-list
      timeoutMs: 30000
    models:
      - id: Qwen3.8-27B-4bit
        name: Qwen3.8-27B
        reasoning: false
        input: [text, image]
        tokenizer: qwen3
        contextWindow: 65536
        maxTokens: 2048
        supportsTools: false
        compat:
          streamIdleTimeoutMs: 600000
      - id: Qwen3.8-27B-4bit-agent
        name: "Qwen3.8-27B tools"
        reasoning: false
        input: [text, image]
        tokenizer: qwen3
        contextWindow: 65536
        maxTokens: 2048
        supportsTools: true
        compat:
          streamIdleTimeoutMs: 600000
