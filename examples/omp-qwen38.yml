# Oh My Pi 18 /model local pane is llama.cpp + lm-studio.
# Those rows ignore a custom `slotbank:` id. Do NOT put `discovery:` on
# llama.cpp / lm-studio: that replaces the implicit probe and F5 keeps a
# cached empty list. Static models show even before weights finish loading.
# After writing this file: omp models refresh
# Picker: llama.cpp/Qwen3.8-27B-4bit  (or lm-studio/Qwen3.8-27B-4bit)
#
# 4-bit + native MTP (trained K=3). OMP default temperature is 1.0.
#   PYTHONPATH=src .venv/bin/python -m slotbank.cli serve \
#     --model ~/Models/Qwen3.8-27B-4bit \
#     --leave-free 6g --thinking --vision --direct
providers:
  llama.cpp:
    baseUrl: http://127.0.0.1:8080/v1
    api: openai-completions
    auth: none
    disableStrictTools: true
    models:
      - id: Qwen3.8-27B-4bit
        name: Qwen3.8-27B-4bit (slotbank)
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh]
          defaultLevel: high
        input: [text, image]
        tokenizer: qwen3
        contextWindow: 32768
        maxTokens: 8192
        supportsTools: true
        compat:
          thinkingFormat: qwen-chat-template
          supportsReasoningParams: true
  lm-studio:
    baseUrl: http://127.0.0.1:8080/v1
    api: openai-completions
    auth: none
    disableStrictTools: true
    models:
      - id: Qwen3.8-27B-4bit
        name: Qwen3.8-27B-4bit (slotbank)
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh]
          defaultLevel: high
        input: [text, image]
        tokenizer: qwen3
        contextWindow: 32768
        maxTokens: 8192
        supportsTools: true
        compat:
          thinkingFormat: qwen-chat-template
          supportsReasoningParams: true
  slotbank:
    baseUrl: http://127.0.0.1:8080/v1
    api: anthropic-messages
    auth: none
    disableStrictTools: true
    discovery:
      type: openai-models-list
      timeoutMs: 30000
    models:
      - id: Qwen3.8-27B-4bit
        name: Qwen3.8-27B-4bit (slotbank)
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh]
          defaultLevel: high
        input: [text, image]
        tokenizer: qwen3
        contextWindow: 32768
        maxTokens: 8192
        supportsTools: true
