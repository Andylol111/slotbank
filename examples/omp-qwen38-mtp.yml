# Optional: DFlash2 (trained K=8) instead of native MTP.
# Daily path is examples/omp-qwen38.yml (MTP-4bit).
# Picker: llama.cpp/Qwen3.8-27B-4bit  (name: Qwen3.8-27B)
# Then: omp models refresh
# /no_think by default; /think on the last ask to reason.
#
#   PYTHONPATH=src .venv/bin/python -m slotbank.cli serve \
#     --model ~/Models/Qwen3.8-27B-4bit \
#     --draft ~/Models/Qwen3.8-27B-DFlash2-4bit \
#     --leave-free 6g --thinking --vision --direct
providers:
  llama.cpp:
    baseUrl: http://127.0.0.1:8080/v1
    api: openai-completions
    auth: none
    disableStrictTools: true
    models:
      - id: Qwen3.8-27B-4bit
        name: Qwen3.8-27B
        reasoning: false
        input: [text, image]
        tokenizer: qwen3
        contextWindow: 65536
        maxTokens: 2048
        supportsTools: true
        compat:
          streamIdleTimeoutMs: 600000
