# Optional: DFlash2 (trained K=8) instead of native MTP.
# Cool A/B 2026-08-31: slower than MTP on this Air (11.76 vs 13.47 count).
# Daily path is examples/omp-qwen38.yml (MTP-4bit). Same OMP provider id;
# `slotbank serve` overwrites ~/.omp/agent/models.yml for whichever pack is live.
#
#   PYTHONPATH=src .venv/bin/python -m slotbank.cli serve \
#     --model ~/Models/Qwen3.8-27B-4bit \
#     --draft ~/Models/Qwen3.8-27B-DFlash2-4bit \
#     --leave-free 6g --thinking --vision --direct
providers:
  slotbank:
    baseUrl: http://127.0.0.1:8080/v1
    api: anthropic-messages
    auth: none
    disableStrictTools: true
    discovery:
      type: openai-models-list
      timeoutMs: 2000
    models:
      - id: Qwen3.8-27B-4bit
        name: Qwen3.8-27B-4bit (slotbank)
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh]
          defaultLevel: high
        input: [text, image]
        tokenizer: qwen3
        contextWindow: 16384
        maxTokens: 8192
        supportsTools: true
