# Parallel IQ3_XXS path. Does NOT replace 4-bit + MTP on :8080.
#
# Daily 27B (keep this):
#   PYTHONPATH=src .venv/bin/python -m slotbank.cli serve \
#     --model ~/Models/Qwen3.8-27B-4bit \
#     --draft ~/Models/Qwen3.8-27B-MTP-4bit \
#     --leave-free 6g --thinking --vision --direct
#
# IQ3 sidecar (llama.cpp, OpenAI door, other port — 24 GB cannot hold both):
#   llama-server \
#     -m ~/Models/Qwen3.8-27B-GSQ-RCO-IQ3_XXS/Qwen3.8-27B-GSQ-RCO-IQ3_XXS.gguf \
#     -ngl 99 -c 8192 --parallel 1 --fit off --flash-attn on \
#     --reasoning off --no-mmproj --jinja --host 127.0.0.1 --port 8765
#   SLOTBANK_CONTEXT_DIR=/path/to/session PYTHONPATH=src \
#     .venv/bin/python scripts/check_iq3_sidecar.py
#
# OMP: openai-completions on :8765. Decode stays ~2 tok/s (IQ kernels).
# Copy under providers: in ~/.omp/agent/models.yml alongside slotbank, or
# slotbank serve will keep a valid sibling provider that already uses baseUrl.
providers:
  llama-iq3-xxs:
    baseUrl: http://127.0.0.1:8765/v1
    api: openai-completions
    auth: none
    discovery:
      type: openai-models-list
      timeoutMs: 2000
    models:
      - id: Qwen3.8-27B-GSQ-RCO-IQ3_XXS
        name: Qwen3.8-27B IQ3_XXS (llama.cpp)
        reasoning: false
        input: [text]
        contextWindow: 8192
        maxTokens: 4096
        supportsTools: true
