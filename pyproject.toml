[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slotbank"
version = "0.1.0"
description = "Apple Silicon MoE runtime: file-backed expert bank, C-slot LRU, Chat/Claude/Codex APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Andre" }]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mlx==0.32.1",
    "mlx-lm",
    "huggingface-hub>=0.30",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "safetensors>=0.6,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# mlx-vlm carries model classes mlx-lm does not (kimi_k3, deepseek_v4,
# minimax_m3). slotbank falls back to it when mlx-lm cannot build a model,
# so it is only needed for those families.
vlm = ["mlx-vlm>=0.6"]

[project.scripts]
slotbank = "slotbank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
